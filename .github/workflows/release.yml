name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

      - name: Auto-merge Release PR
        if: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUM="${{ fromJson(steps.release.outputs.pr).number }}"
          echo "Release PR #$PR_NUM detected. Attempting to merge or enable auto-merge..."
          gh pr merge --merge "$PR_NUM" || gh pr merge --auto --merge "$PR_NUM" || echo "Auto-merge could not be set automatically. Check repo settings."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout master
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: master

      - name: Setup Node.js
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm ci

      - name: Build Userscripts with bumped versions
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm run build

      - name: Commit and push updated dist bundles
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update dist bundles for release [skip ci]"
            git push origin master
          else
            echo "No changes in dist/ to commit."
          fi
